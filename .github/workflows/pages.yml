# Каждый час загружает действующие ПРИП с mapm.ru и публикует карту и файлы на GitHub Pages.
# Если mapm.ru не ответил, публикация не происходит — на сайте остаётся предыдущая версия
# (дата обновления видна в шапке карты).
name: Карта ПРИП

on:
  schedule:
    - cron: "17 * * * *"     # каждый час в :17 (GitHub может задерживать запуски по расписанию)
  workflow_dispatch:          # ручной запуск: Actions → «Карта ПРИП» → Run workflow
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Загрузка ПРИП и сборка карты
        run: |
          if ! python prip_update.py site > build.log 2>&1; then
            cat build.log
            # текст ошибки — в аннотацию, её видно на странице запуска без входа в аккаунт
            echo "::error title=Сборка карты не удалась::$(tail -n 3 build.log | tr '\n' ' ')"
            echo "::error title=Проверка mapm.ru::$(curl -sS -o /dev/null -m 30 -w 'HTTP %{http_code}, %{time_total}s' https://www.mapm.ru/PripAr 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          cat build.log
          cp site/prip_map.html site/index.html
          # карта сайта для Яндекс Вебмастера и Google Search Console
          cat > site/sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://kubiqq.github.io/PRIP/</loc><lastmod>$(date -u +%Y-%m-%dT%H:%M:%S+00:00)</lastmod><changefreq>hourly</changefreq></url>
          </urlset>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
